<!DOCTYPE html>
<!--
    Empty page for the workarea preview in a new tab (content domain mode).
    The workarea that opens it puts one sandboxed frame in the body, with the
    preview on the content origin of the project (previewPanel.js). Nothing
    else belongs here, and no script may ever run in this page.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src http: https:; style-src 'unsafe-inline'">
<title>Preview</title>
<style>iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body></body>
</html>
